name: CI

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Test version
        run: vulnscan --version
      - name: Test help
        run: vulnscan --help
