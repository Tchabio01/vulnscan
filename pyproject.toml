[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscan"
version = "3.4.0"
description = "Scanner pedagogique de vulnerabilites web (Linux/Windows/macOS/Termux)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Tchabio01" }]
keywords = ["security", "scanner", "pentest", "web", "educational"]
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "jinja2>=3.1.0",
    "rich>=13.0",
    "dnspython>=2.6",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "build", "twine", "ruff"]

[project.urls]
Homepage = "https://github.com/Tchabio01/vulnscan"
Issues = "https://github.com/Tchabio01/vulnscan/issues"
Changelog = "https://github.com/Tchabio01/vulnscan/blob/main/CHANGELOG.md"

[project.scripts]
vulnscan = "vulnscan:main"

[tool.setuptools]
py-modules = ["vulnscan"]

[tool.setuptools.package-data]
"*" = ["docs/**/*.md"]
